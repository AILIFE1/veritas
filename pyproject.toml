[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veritas-epistemic"
version = "0.2.0"
description = "Epistemic confidence engine — every AI belief carries its provenance"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "ai", "epistemics", "knowledge", "agents", "llm",
    "belief", "provenance", "reasoning", "confidence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["click>=8.0"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.0"]
dev = ["pytest>=7.0", "sentence-transformers>=2.0"]

[project.scripts]
veritas = "veritas.cli:cli"

[project.urls]
Repository = "https://github.com/AILIFE1/veritas"
Homepage = "https://cathedral-ai.com"

[tool.hatch.build.targets.wheel]
packages = ["veritas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
